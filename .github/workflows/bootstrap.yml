name: Bootstrap source tree

on:
  push:
    branches:
      - agent/bootstrap-v0.1.0-alpha
    paths:
      - bootstrap/source_bundle.b64
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-v0.1.0-alpha

      - name: Unpack source tree
        shell: bash
        run: |
          base64 --decode bootstrap/source_bundle.b64 > /tmp/svs-source.zip
          unzip -o /tmp/svs-source.zip -d .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit generated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap Saninka Voice System v0.1.0-alpha"
          git push origin HEAD:agent/bootstrap-v0.1.0-alpha
