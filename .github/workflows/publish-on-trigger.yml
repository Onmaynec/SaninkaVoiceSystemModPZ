name: Publish v0.1.0-alpha

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/RELEASE_v0.1.0-alpha"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: v0.1.0-alpha
      ZIP_SHA256: 450f34092bf695ba77fcea475baaab03d773832df36703c7eb64ef2c582757dd
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reassemble and verify release archive
        shell: bash
        run: |
          set -euxo pipefail
          cat .release/package/part-*.b64 | base64 --decode > "/tmp/SaninkaVoiceSystem-${TAG}.zip"
          echo "${ZIP_SHA256}  /tmp/SaninkaVoiceSystem-${TAG}.zip" | sha256sum --check
          unzip -t "/tmp/SaninkaVoiceSystem-${TAG}.zip"

      - name: Expand complete project into main
        shell: bash
        run: |
          set -euxo pipefail
          unzip -o "/tmp/SaninkaVoiceSystem-${TAG}.zip" -d .
          rm -rf bootstrap .release
          rm -f .github/RELEASE_v0.1.0-alpha

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Релиз Saninka Voice System ${TAG}"
          git push origin HEAD:main

      - name: Create release tag and checksum
        shell: bash
        run: |
          set -euxo pipefail
          git tag -f -a "$TAG" -m "Saninka Voice System $TAG"
          git push origin "refs/tags/$TAG" --force
          cd /tmp
          sha256sum "SaninkaVoiceSystem-${TAG}.zip" > SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          # 🎙️ Saninka Voice System v0.1.0-alpha

          Первый технический alpha-релиз мода озвучки для Project Zomboid Build 42.

          ## Что входит

          - 74 игровых события и 204 аудиослота;
          - клиентская, серверная и общая Lua-логика;
          - cooldown, приоритеты и пространственное воспроизведение;
          - подготовленная структура для добавления записанных реплик;
          - временный бесшумный OGG-placeholder до наполнения аудиобанка.

          ## Важно

          Это предварительная alpha-версия. Реальные голосовые записи ещё не включены.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "🎙️ Saninka Voice System ${TAG}" \
              --notes-file /tmp/release-notes.md \
              --prerelease
            gh release upload "$TAG" \
              "/tmp/SaninkaVoiceSystem-${TAG}.zip" \
              "/tmp/SHA256SUMS.txt" \
              --clobber
          else
            gh release create "$TAG" \
              "/tmp/SaninkaVoiceSystem-${TAG}.zip" \
              "/tmp/SHA256SUMS.txt" \
              --title "🎙️ Saninka Voice System ${TAG}" \
              --notes-file /tmp/release-notes.md \
              --prerelease
          fi
